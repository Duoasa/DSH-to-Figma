name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:all
      - name: Generated companion must be committed
        run: git diff --exit-code -- companion/code.js companion/ui.html
      - name: Bounded query benchmark and discovery equivalence
        run: npm run benchmark -- --runs 3 --output /tmp/dsh-figma-benchmark.json
      - run: npm run package:companion
      - name: Pack runtime without bundled showcase images
        run: |
          npm pack --ignore-scripts --pack-destination dist --json > /tmp/dsh-package.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          import assert from 'node:assert/strict'
          const [pkg] = JSON.parse(readFileSync('/tmp/dsh-package.json', 'utf8'))
          assert.ok(pkg.size < 2 * 1024 * 1024, 'DSH package exceeds the 2 MiB runtime budget')
          assert.ok(!pkg.files.some(file => /^assets\/(examples\/|readme-hero\.|social-preview\.)/.test(file.path)), 'Showcase images must stay in the repository, not the runtime package')
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: DSH-to-Figma-packages
          path: |
            dist/DSH-to-Figma-companion-*.zip
            dist/dsh-to-figma-*.tgz
          if-no-files-found: error
