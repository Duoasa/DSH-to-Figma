<!doctype html><html><head><meta charset="utf-8"><style>
:root{font:12px Inter,system-ui,sans-serif;color:var(--figma-color-text,#222);background:var(--figma-color-bg,#fff)}*{box-sizing:border-box}body{margin:0;padding:22px}header{display:flex;align-items:center;gap:10px;margin-bottom:20px}.logo{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:#6755db;color:white;font-size:18px;font-weight:700}h1{font-size:17px;margin:0;letter-spacing:-.4px}.subtitle{opacity:.6;margin-top:3px;font-size:11px}.card{padding:16px;border:1px solid var(--figma-color-border,#e5e5ec);border-radius:12px}#document{font-weight:600;overflow-wrap:anywhere}#status{line-height:1.6;min-height:50px;margin-top:10px;overflow-wrap:anywhere}.badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--figma-color-text-secondary,#686578);margin-top:12px}.dot{width:7px;height:7px;background:#aaa;border-radius:50%}body[data-state=connected] .dot{background:#30a46c}body[data-state=connecting] .dot{background:#e2a436}body[data-state=blocked] .dot{background:#d15e5e}button{width:100%;padding:11px;margin-top:14px;border:0;border-radius:8px;background:#6755db;color:#fff;font-weight:600;cursor:pointer}button:disabled{opacity:.5;cursor:default}p,small{line-height:1.6;color:var(--figma-color-text-secondary,#686578)}small{display:block;font-size:11px;margin-top:12px}details{margin-top:16px}summary{cursor:pointer;font-size:11px;color:var(--figma-color-text-secondary,#686578)}label{display:block;font-size:11px;margin:12px 0 5px}input{width:100%;padding:8px;border:1px solid var(--figma-color-border,#ddd);border-radius:6px;background:var(--figma-color-bg,#fff);color:inherit}#advanced-connect{background:var(--figma-color-bg-secondary,#eeedf5);color:inherit;margin-top:10px}
</style></head><body data-state="connecting"><header><div class="logo">↔</div><div><h1>DSH to Figma</h1><div class="subtitle">本地画布助手 · Local canvas companion <span id="version"></span></div></div></header><div class="card"><div id="document">正在读取当前文件…</div><div class="badge"><span class="dot"></span><span id="state-label">准备连接 / Preparing</span></div><div id="status" role="status" aria-live="polite">已配对版本将在启动后自动连接 DSH。</div><button id="connect">连接 DSH / Connect</button></div><small>保持此窗口打开，DSH 就能读取和编辑当前文件。单文件自动选用；连接多个文件时，在 DSH 中选择目标。</small><details id="advanced"><summary>高级设置 / Advanced</summary><label for="token">手动配对密钥（仅通用版需要） / Manual token</label><input id="token" type="password" autocomplete="off" placeholder="推荐在 DSH 中调用 figma_setup"><label for="file">文件链接（可选） / File URL</label><input id="file" placeholder="https://www.figma.com/design/…"><button id="advanced-connect">使用手动密钥 / Use manual token</button><small>仅连接本机。已配对版本包含本机凭证，请勿上传或分享安装目录及压缩包。</small></details><script>
const base='http://localhost:3055', button=document.querySelector('#connect'), status=document.querySelector('#status')
let endpoint=base,token='',connectionId=null,metadata=null,active=false,inFlight=null,desired=true,connecting=false,blocked=false,generation=0,retryTimer=null,retries=0
const clientId=crypto.randomUUID(),pending=new Map()
const show=(text,state='connecting')=>{status.textContent=text;document.body.dataset.state=state;document.querySelector('#state-label').textContent=({connected:'已连接 / Connected',connecting:'连接中 / Connecting',paused:'已暂停 / Paused',blocked:'需要检查 / Check required',unpaired:'等待首次安装 / Setup'})[state]}
async function request(path,data,timeout=25000){const response=await fetch(endpoint+path,{method:'POST',headers:{authorization:'Bearer '+token,'content-type':'application/json'},body:JSON.stringify(data),signal:AbortSignal.timeout(timeout)});const value=await response.json();if(!response.ok){const error=new Error(value.error||'Bridge unavailable');error.status=response.status;throw error}return value}
function schedule(){clearTimeout(retryTimer);if(desired&&!blocked&&token){const delay=Math.min(10000,1000*2**Math.min(retries++,4));retryTimer=setTimeout(()=>void connect(),delay)}}
function fail(error){active=false;button.disabled=false;if(inFlight){blocked=true;desired=false;show('连接在执行中中断，操作不会重放。请重新打开插件，并先让 DSH 检查画布。 / Interrupted during an operation; reopen and inspect before editing.','blocked');button.textContent='请重新打开插件 / Reopen plugin';button.disabled=true;return}if(error.status===401){desired=false;show('配对已失效。请让 DSH 调用 figma_setup，再运行生成的已配对插件。 / Pairing expired; use figma_setup.','unpaired');button.textContent='重试 / Retry';return}show('等待 DSH 启动…请确认已启用本地模式，将自动重连。 / Waiting for DSH local mode; reconnecting automatically.');button.textContent='立即重试 / Retry now';schedule()}
async function connect(){if(connecting||active||blocked||!desired||!metadata||!token)return;clearTimeout(retryTimer);connecting=true;button.disabled=true;const attempt=++generation
 try{
  if(connectionId){try{await request('/heartbeat',{connectionId},5000)}catch(error){if(error.status!==404&&error.status!==410)throw error;connectionId=null}}
  if(!connectionId){let fileKey=metadata.fileKey||null;const value=document.querySelector('#file').value.trim();if(value){const url=new URL(value);if(!['figma.com','www.figma.com'].includes(url.hostname)||!['design','file','board','slides'].includes(url.pathname.split('/')[1]))throw new Error('Invalid Figma file URL');fileKey=url.pathname.split('/')[2];if(!/^[A-Za-z0-9]{5,128}$/.test(fileKey))throw new Error('Invalid Figma file URL')}
   const result=await request('/connect',{name:metadata.name,editorType:metadata.editorType,fileKey,clientId},5000);connectionId=result.connectionId}
  if(attempt!==generation||!desired)return
  active=true;retries=0;button.textContent='暂停连接 / Pause';show('可以回到 DSH 开始操作。请保持此窗口打开。 / Ready. Return to DSH; keep this window open.','connected');void poll(attempt)
 }catch(error){if(attempt===generation&&desired)fail(error)}finally{connecting=false;if(!blocked)button.disabled=false}
}
async function poll(epoch){while(active&&desired&&generation===epoch){try{const job=await request('/poll',{connectionId});if(!active||!desired||generation!==epoch)break;if(job.id){inFlight=job.id;show('正在执行 / Running: '+job.method,'connected');const result=await new Promise(resolve=>{pending.set(job.id,resolve);parent.postMessage({pluginMessage:{type:'execute',...job}},'*')});await request('/result',{connectionId,...result});inFlight=null;show(result.ok?'操作完成，等待下一步。 / Done. Ready for the next task.':'操作失败，请让 DSH 检查画布。 / Failed; inspect canvas.','connected')}}catch(error){if(generation===epoch&&desired)fail(error);break}}}
window.onmessage=event=>{if(event.source!==parent&&!(event.source===top&&['https://www.figma.com','https://figma.com'].includes(event.origin)))return;const message=event.data?.pluginMessage;if(!message)return
 if(message.type==='document'){
  metadata={name:message.name,editorType:message.editorType,fileKey:message.fileKey};document.querySelector('#document').textContent=message.name+' · '+message.editorType
  const config=message.connection
  if(config&&/^[a-f0-9]{64}$/.test(config.token)&&Number.isInteger(config.port)&&config.port>=1024&&config.port<=65535){token=config.token;endpoint='http://localhost:'+config.port;document.querySelector('#version').textContent=config.version||'';void connect()}
  else if(!token){show('首次使用：在 DSH 中说“帮我连接 Figma”，导入它提供的已配对 manifest，然后运行该插件。 / Ask DSH to prepare the paired companion and import its manifest once.','unpaired');button.textContent='重试 / Retry'}
 }
 if(message.type==='result'){const resolve=pending.get(message.id);if(resolve){pending.delete(message.id);resolve(message)}}
}
parent.postMessage({pluginMessage:{type:'describe'}},'*')
setInterval(()=>{if(active)void request('/heartbeat',{connectionId},5000).catch(()=>{})},10000)
button.onclick=async()=>{
 if(blocked)return
 if(active||connecting){if(inFlight){show('请等待当前操作完成。 / Wait for the current operation.','connected');return}desired=false;active=false;generation++;clearTimeout(retryTimer);try{if(connectionId)await request('/disconnect',{connectionId},5000)}catch{}connectionId=null;button.textContent='恢复连接 / Resume';show('已暂停。点击恢复连接。 / Paused. Click Resume to reconnect.','paused');return}
 desired=true;if(token)void connect();else{document.querySelector('#advanced').open=true;show('推荐使用 DSH 生成的已配对插件。手动连接可在高级设置粘贴密钥。 / Use the paired companion, or enter a token in Advanced.','unpaired')}
}
document.querySelector('#advanced-connect').onclick=()=>{if(active||connecting||inFlight||blocked)return;const value=document.querySelector('#token').value.trim();if(!/^[a-f0-9]{64}$/.test(value)){show('请输入完整的配对密钥。 / Enter the complete pairing token.','unpaired');return}token=value;document.querySelector('#token').value='';desired=true;void connect()}
</script></body></html>
