<!doctype html><html><head><meta charset="utf-8"><style>
:root{font:12px Inter,system-ui,sans-serif;color:var(--figma-color-text,#211f2b);background:var(--figma-color-bg,#fff)}body{margin:24px}h1{font-size:20px;letter-spacing:-.5px;margin:0 0 8px}p{line-height:1.5;opacity:.8}label{display:block;margin:16px 0 6px;font-weight:600}input{box-sizing:border-box;width:100%;padding:10px;border:1px solid var(--figma-color-border,#ddd);border-radius:8px;background:var(--figma-color-bg,#fff);color:inherit}button{width:100%;padding:11px;margin-top:18px;border:0;border-radius:8px;background:#7655d9;color:#fff;font-weight:600;cursor:pointer}button:disabled{opacity:.5}#status{padding:12px;margin-top:16px;border-radius:8px;background:var(--figma-color-bg-secondary,#f3f2f6);word-break:break-word}small{display:block;margin-top:12px;line-height:1.4;opacity:.7}
</style></head><body><h1>DSH to Figma</h1><p id="document">连接当前画布 · Connect this canvas</p><label for="token">本机配对密钥 / Pairing token</label><input id="token" type="password" autocomplete="off" placeholder="dsh-figma pair"><label for="file">文件链接（可选） / File URL (optional)</label><input id="file" placeholder="https://www.figma.com/design/…"><button id="connect">连接 DSH / Connect</button><div id="status" role="status">在 DSH 中启用插件，然后运行 dsh-figma pair 获取密钥。</div><small>仅连接本机 localhost:3055。连接后，DSH 可操作此文件。密钥仅保留在本窗口内存，关闭插件即断开。</small><script>
const base='http://localhost:3055', button=document.querySelector('#connect'), status=document.querySelector('#status')
let token='', connectionId=null, metadata=null, active=false, inFlight=null
const pending=new Map()
const show=text=>{status.textContent=text}
async function request(path,data,timeout=25000){const response=await fetch(base+path,{method:'POST',headers:{authorization:'Bearer '+token,'content-type':'application/json'},body:JSON.stringify(data),signal:AbortSignal.timeout(timeout)});const value=await response.json();if(!response.ok)throw new Error(value.error||'Bridge unavailable');return value}
window.onmessage=event=>{if(event.source!==parent&&!(event.source===top&&['https://www.figma.com','https://figma.com'].includes(event.origin)))return;const message=event.data.pluginMessage;if(!message)return;if(message.type==='document'){metadata=message;document.querySelector('#document').textContent=message.name+' · '+message.editorType}if(message.type==='result'){const resolve=pending.get(message.id);if(resolve){pending.delete(message.id);resolve(message)}}}
parent.postMessage({pluginMessage:{type:'describe'}},'*')
setInterval(()=>{if(active)void request('/heartbeat',{connectionId}).catch(()=>{})},10000)
async function poll(){while(active){try{const job=await request('/poll',{connectionId});if(!active)break;if(job.id){show('执行中 / Running: '+job.method);inFlight=job.id;const result=await new Promise(resolve=>{pending.set(job.id,resolve);parent.postMessage({pluginMessage:{type:'execute',...job}},'*')});await request('/result',{connectionId,...result});inFlight=null;show(result.ok?'已连接 · 操作完成 / Connected':'操作失败，请检查画布 / Inspect canvas: '+result.error)}}catch(error){active=false;button.textContent='重新连接 / Reconnect';show('连接中断；操作不会自动重放。'+error.message)}}}
button.onclick=async()=>{if(active){if(inFlight){show('等待当前操作结束，再断开。关闭插件可强制停止；操作可能已部分生效。');return}active=false;try{await request('/disconnect',{connectionId})}catch{}connectionId=null;button.textContent='连接 DSH / Connect';show('已断开 / Disconnected');return}if(inFlight){show('上一操作结果未知，请关闭并重新打开此插件后检查画布。');return}token=document.querySelector('#token').value.trim();if(!/^[a-f0-9]{64}$/.test(token)){show('请粘贴 dsh-figma pair 显示的完整密钥。');return}if(!metadata){show('正在读取画布，请稍后重试。');return}let fileKey=null;try{const value=document.querySelector('#file').value.trim();if(value){const url=new URL(value);if(!['figma.com','www.figma.com'].includes(url.hostname))throw new Error();fileKey=url.pathname.split('/')[2];if(!/^[A-Za-z0-9]{5,128}$/.test(fileKey))throw new Error()}}catch{show('文件链接无效 / Invalid Figma file URL');return}button.disabled=true;try{const result=await request('/connect',{...metadata,fileKey});connectionId=result.connectionId;active=true;button.textContent='断开 / Disconnect';show('已连接。请在 DSH 中选择此文件 / Select this document in DSH.');void poll()}catch(error){show(error.message)}finally{button.disabled=false}}
</script></body></html>
